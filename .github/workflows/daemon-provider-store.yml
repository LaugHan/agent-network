name: Daemon Provider persistence
on:
  pull_request:
    paths:
      - 'agent-network/**'
      - 'agent-node/src/**'
      - 'server/**'
      - 'tests/test906-daemon-provider-management/**'
      - '.github/workflows/daemon-provider-store.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  store:
    name: daemon-provider-store (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Private daemon configuration and isolation tests
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile -t anet-provider-management:test906 .'
          sg docker -c 'docker run --rm anet-provider-management:test906'
      - name: Compiled CLI roundtrip (offline)
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.cli -t anet-provider-management:test906-cli .'
          sg docker -c 'docker run --rm --network none anet-provider-management:test906-cli'
      - name: Hub and daemon scoped readback (offline)
        run: |
          sg docker -c 'docker build -f tests/test906-daemon-provider-management/Dockerfile.transport -t anet-provider-management:test906-transport .'
          sg docker -c 'docker run --rm --network none anet-provider-management:test906-transport'
